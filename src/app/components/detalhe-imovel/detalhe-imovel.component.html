<div class="card" *ngIf="imovel">
  <h2 class="card-title">{{ imovel.titulo }}</h2>
  <p><strong>Cidade:</strong> {{ imovel.cidade }}</p>
  <p><strong>Estado:</strong> {{ imovel.estado }}</p>
  <p><strong>Valor:</strong> {{ imovel.valor | currency:'BRL':true }}</p>

  <h3>Imagens:</h3>
  <div class="imagens-container">
    <img *ngFor="let imagem of imovel.imagens" [src]="imagem" class="imagem-detalhe">
  </div>

  <div class="botoes-acoes">
    <button [routerLink]="['/editar-imovel', imovel.id]" class="btn btn-primary">Editar Imóvel</button>
    <button (click)="deletarImovel()" class="btn btn-danger">Deletar Imóvel</button>
  </div>
</div>

<div *ngIf="errorMessage">
  <p class="error-message">{{ errorMessage }}</p>
</div>

<div *ngIf="successMessage">
  <p class="success-message">{{ successMessage }}</p>
</div>

<div *ngIf="!imovel && !errorMessage && imovelId">
  <p>Carregando detalhes do imóvel...</p>
</div>

<div *ngIf="!imovel && !errorMessage && !imovelId">
  <p>ID do imóvel inválido.</p>
</div>
